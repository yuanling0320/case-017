function home(){const canContinue=state.started;return `<header class="topbar"><div class="top-inner"><div class="brand"><span class="brand-mark">017</span> CASE FILES / 互動推理系統</div><div class="nav-actions"><button class="btn sm ghost" data-action="instructions">操作說明</button></div></div></header><section class="home"><div><div class="eyebrow">CONFIDENTIAL CASE · 2026 / 11 / 13</div><h1>CASE 017<em>消失的<br>三萬六千元</em></h1><p class="home-sub">你以為自己看穿了罪犯，卻沒發現自己的判斷正在被操控。</p><p class="home-desc">一筆高中義賣款、四名關係人、一張匿名便條。你將查閱檔案、觀察證據、重建現場，並在最後面對自己的調查盲點。</p><div class="toolbar"><button class="btn gold" data-action="${canContinue?'restartPrompt':'start'}">${canContinue?'開始新遊戲':'開始新遊戲 →'}</button>${canContinue?'<button class="btn" data-action="continue">繼續調查 →</button>':''}</div><div class="toolbar" style="color:#93a4b4;font-size:.83rem">單人遊戲 · 約 20–25 分鐘 · 本機自動存檔 · 全離線可玩</div></div><div class="cover-art" aria-hidden="true"><div class="file-cover"><div><div class="eyebrow">CLASSIFIED / ARCHIVE</div><div class="case-id">017</div><div style="margin-top:13px;letter-spacing:.18em">LOST FUND / J-07</div></div><div><div style="border-top:1px solid #697582;padding-top:13px;font-family:monospace">2026.11.13<br>15:05 → 15:50<br>NTD 36,000</div><div class="stamp">未結案</div></div><div class="paper-corner"></div></div></div></section>`}
function prologue(){const suspects=[...Object.entries(PEOPLE).map(([id,p])=>`<button class="person" data-action="person" data-id="${id}"><span class="avatar">${id}</span><strong>${p.name}</strong><span class="muted">${p.age} 歲 · ${p.role}</span>${state.viewedPeople.includes(id)?'<span class="viewed">✓ 已閱</span>':'<span class="tag">點閱檔案</span>'}</button>`)].join('');return `${chapterHead('消失的義賣款','11 月 13 日｜校園內部事件 · 初步調查')}<div class="panel gold-edge"><div class="section-label">機密通報 · SYSTEM INITIALIZED</div><div class="story"><p>2026 年 11 月 13 日，15：05。活動負責老師將裝有 <strong>新臺幣 36,000 元</strong>的藍色保管袋 <strong>J-07</strong> 放入社團準備室。</p><p>15：50，老師返回時，保管袋已不見，現場沒有明顯破壞。桌上留下紙條：「<strong>有些事情，不知道比較好。</strong>」</p><p>你受邀協助整理證據。校方要求保留各種可能，避免把猜測當作結論。</p></div><div class="status-stripe"><span class="status-dot"></span><span class="tag gold">案件狀態：調查中</span><span class="tag">證物編號 J-07</span></div></div><div class="panel"><div class="section-label">四份關係人檔案 · ${state.viewedPeople.length} / 4 已讀</div><div class="four">${suspects}</div><p class="muted" style="font-size:.82rem;margin:12px 0 0">請逐一點開四份檔案，完成後記錄你的第一印象。</p></div><div class="panel"><div class="section-label">初步判斷</div>${state.viewedPeople.length<4?'<p>閱讀四份人物檔案後解鎖。</p>':`<p>在查證影像與實物之前，你最懷疑誰？這份答案會記錄在最後的調查報告中。</p><div class="choice-list">${[...Object.entries(PEOPLE).map(([id,p])=>[id,`${id}. ${p.name}`]),['E','E. 證據不足，暫時無法判斷']].map(([id,label])=>`<button class="answer ${state.choices.initial===id?'selected':''}" data-action="initial" data-id="${id}">${label}</button>`).join('')}</div>`}${state.choices.initial?'<div class="notice ok">你的初步判斷已記錄。請記住，直覺不等於證據。</div>':''}${consume()}${finishButton(0,'進入第一章 →')}</div>`}

function chapter1(){const f=state.flags;return `${chapterHead('破碎的童年','第一章｜別把一段人生當成一份罪證')}<div class="panel"><div class="section-label">人物資料室 · 點擊四件物品</div><div class="room">${ROOM_OBJECTS.map(o=>`<button class="object-btn ${flag('room_'+o.id)?'seen':''}" data-action="roomObject" data-id="${o.id}"><span class="obj-icon">${o.icon}</span><b>${o.name}</b><small>${flag('room_'+o.id)?'✓ 已讀檔':'點擊檢視'}</small></button>`).join('')}</div><p class="muted" style="font-size:.82rem;margin:11px 0 0">已檢視 ${ROOM_OBJECTS.filter(o=>flag('room_'+o.id)).length}/4 件。紙本背景資料僅供理解個人處境。</p></div>${ROOM_OBJECTS.every(o=>flag('room_'+o.id))?`<div class="panel"><div class="section-label">經歷卡片分類 · ${Object.keys(state.assignments).length}/4 已放置</div><p>先點選左側經歷卡，再點右側分類區；桌面也可拖曳放置。放錯可重新分類。</p><div class="split"><div><div class="grid2">${RISK_CARDS.map(c=>`<div class="sort-card ${selectedCard===c.id?'active':''}" draggable="true" data-drag-type="risk" data-drag-id="${c.id}" role="button" tabindex="0" data-action="selectRisk" data-id="${c.id}">${c.text}<span class="assigned">${state.assignments[c.id]?(state.assignments[c.id]==='risk'?'已放：風險':'已放：保護'):'點選或拖曳'}</span></div>`).join('')}</div></div><div class="grid2"><div class="dropzone risk" data-drop-type="risk" data-drop-id="risk" data-action="assignRisk" data-id="risk"><h3>可能的風險因子</h3><small>哪些經歷可能增加壓力？</small><div>${RISK_CARDS.filter(c=>state.assignments[c.id]==='risk').map(c=>`<span class="assigned-item">${c.text}</span>`).join('')}</div></div><div class="dropzone protect" data-drop-type="risk" data-drop-id="protect" data-action="assignRisk" data-id="protect"><h3>可能的保護因子</h3><small>哪些關係有助於因應？</small><div>${RISK_CARDS.filter(c=>state.assignments[c.id]==='protect').map(c=>`<span class="assigned-item">${c.text}</span>`).join('')}</div></div></div></div><div class="toolbar"><button class="btn gold" data-action="verifyRisk" ${Object.keys(state.assignments).length<4?'disabled':''}>檢查四張分類</button>${f.aSortSolved?'<span class="tag ok">✓ 分類正確</span>':''}</div>${consume()}</div>`:''}${f.aSortSolved?`<div class="panel"><div class="section-label">調查判斷 · A 的過去是否就是證據？</div><p>你會如何評估 A 的童年經歷與本案的關係？</p><div class="choice-list"><button class="answer" data-action="aJudgment" data-id="bias">有家庭創傷又曾衝突，所以可直接認定 A 是主要涉案者。</button><button class="answer ${f.aJudgmentCorrect?'done':''}" data-action="aJudgment" data-id="fair">背景可協助理解風險與保護條件，但不能當成這次事件的直接證據。</button></div>${f.aJudgmentCorrect?knowledge('ACEs 與保護因子','童年逆境經驗（ACEs）與部分長期健康、行為風險有統計關聯，但不決定個人是否犯罪。支持性人際關係可以提供保護。'):''}</div>`:''}${f.aJudgmentCorrect?`<div class="panel"><div class="section-label">交叉查證 · 時間證據</div><div class="grid2"><button class="tile ${f.aInterviewSeen?'done':''}" data-action="aInterview"><strong>訪談 A｜15：11</strong><p>詢問他當時為何進入準備室。</p><small>${f.aInterviewSeen?'✓ 已取得訪談':'點擊檢視'}</small></button><button class="tile ${f.aPhotoSeen?'done':''}" data-action="aPhoto"><strong>活動照片｜15：28</strong><p>照片背景可能包含重要現場資訊。</p><small>${f.aPhotoSeen?'✓ 已取得照片':'點擊檢視'}</small></button></div>${f.aInterviewSeen&&f.aPhotoSeen?'<div class="notice ok">A 在 15：11 進入，但 J-07 在 15：28 仍留在桌上。單靠早先進出無法支持他取走保管袋。</div>':''}${finishButton(1,'進入第二章 →')}</div>`:''}`}
function chapter2(){const f=state.flags;return `${chapterHead('操縱者的遊戲','第二章｜一段有說服力的話，離證據還有多遠？')}<div class="split"><div class="panel"><div class="section-label">虛構通訊紀錄 · 副社長 B</div><div class="chat"><div class="chat-head"><span class="avatar" style="background:#365061;border-radius:50%;width:34px;height:34px;display:grid;place-items:center">B</span><div><b>林宇呈</b><div class="muted" style="font-size:.72rem">社團協作群組 · 訊息節錄</div></div></div><div class="bubble"><span class="who">林宇呈</span>如果沒有我，這個活動根本不可能成功。他們應該感謝我。</div><div class="bubble"><span class="who">林宇呈</span>只要讓他以為那是自己的決定，他就會照我的意思行動。</div><div class="bubble"><span class="who">林宇呈</span>他傷心跟我有什麼關係？只要我的目標達到了就好。</div></div>${knowledge('暗黑三角','暗黑三角涵蓋自戀、馬基維利主義與心理病態相關特質。這些概念描述特質傾向，不能用幾句話做診斷，更不能直接推定犯罪。')}</div><div class="panel"><div class="section-label">證詞分析 · 特質配對</div><p>挑一句對話，再點一個對應特質。也能在電腦上拖曳。</p><div class="choice-list">${QUOTES.map(q=>`<button class="quote-tile ${selectedQuote===q.id?'selected':''}" data-action="quotePick" data-id="${q.id}" draggable="true" data-drag-type="trait" data-drag-id="${q.id}"><span class="tag">對話 ${q.id.slice(1)}</span><div style="margin-top:5px">${q.text}</div><small>${state.traitMatches[q.id]?'已配對：'+TRAITS.find(t=>t.id===state.traitMatches[q.id]).name:'點選配對'}</small></button>`).join('')}</div><div class="grid3" style="margin-top:14px">${TRAITS.map(t=>`<div class="trait-target" data-action="traitAssign" data-id="${t.id}" data-drop-type="trait" data-drop-id="${t.id}" role="button" tabindex="0"><strong>${t.name}</strong><span>${t.desc}</span></div>`).join('')}</div><div class="toolbar"><button class="btn gold" data-action="verifyTraits" ${Object.keys(state.traitMatches).length!==3?'disabled':''}>核對配對</button>${f.traitsDone?'<span class="tag ok">✓ 特質卡完成</span>':''}</div>${consume()}</div></div>${f.traitsDone?`<div class="panel"><div class="section-label">即時訊息 · B 正在影響你的調查方向</div><div class="chat"><div class="bubble"><span class="who">林宇呈</span>我覺得你應該先查 A。他以前家庭就有問題，而且常常跟人吵架。這種人很容易做出衝動的事情吧？</div></div><p style="margin:15px 0 8px">你的回覆：</p><div class="choice-list"><button class="answer" data-action="bAnswer" data-id="A">A. 你說得對，A 最可疑。</button><button class="answer" data-action="bAnswer" data-id="B">B. 所以你認為 A 一定偷了錢？</button><button class="answer ${f.bResponseCorrect?'done':''}" data-action="bAnswer" data-id="C">C. 你有沒有實際證據可以支持這項懷疑？</button></div>${f.bResponseCorrect?'<div class="notice ok">你成功將話題帶回事實查證。帶有評價的說法必須有獨立資料支持。</div>':''}</div>`:''}${f.bResponseCorrect?`<div class="panel"><div class="section-label">出入紀錄查核</div><p>系統發現 B 在事發日留下門禁紀錄。開啟資料以交叉核對。</p><button class="btn" data-action="bRecord">${f.bRecordSeen?'重新檢視：15：20 出入紀錄':'讀取 15：20 出入紀錄 →'}</button>${f.bRecordSeen?'<div class="notice ok">B 在 15：20 曾進入準備室取名單，但 15：28 照片仍看得到 J-07。</div>':''}${finishButton(2,'進入第三章 →')}</div>`:''}`}
function handwritingPaper(text,kind){return `<div class="handwriting sample ${kind||''}"><div class="script">${text}</div><span class="paper-label">DOCUMENT SAMPLE / ARCHIVE</span></div>`}
function chapter3(){const f=state.flags;const samples={A:'明日活動海報請照原定位置張貼。',B:'本次義賣活動的工作分配應先確認。',C:'活動資料收件後，請確認是否交給幹部。'};return `${chapterHead('字跡中的謊言','第三章｜看起來像，不等於出自同一人')}<div class="panel"><div class="section-label">社團準備室 · 鑑識工作台</div><div class="workbench"><div><h3>匿名便條 · 正面</h3>${!state.noteBack?`<div class="handwriting"><div class="script">有些事情，<br>不知道比較好。</div><span class="paper-label">FOUND 15:50 · FRONT</span></div>`:`<div class="note-back"><div class="print-sticker">列印作業<br><b>P1530-4F21</b></div></div>`}<div class="toolbar"><button class="btn sm" data-action="zoomNote">放大檢視</button>${f.hdJudgmentCorrect?`<button class="btn sm gold" data-action="flipNote">${state.noteBack?'翻回正面':'翻到背面 ↻'}</button>`:'<span class="tag">背面待解鎖</span>'}</div></div><div><h3>三份書寫樣本 · ${state.sample}</h3><div class="compare-wrap" style="--zoom:${state.zoom/100}">${handwritingPaper(samples[state.sample],state.sample.toLowerCase())}${state.overlay?`<div class="overlay-sheet handwriting"><div class="script">有些事情，<br>不知道比較好。</div></div>`:''}</div><div class="toolbar">${['A','B','C'].map(id=>`<button class="btn sm ${state.sample===id?'gold':''}" data-action="sample" data-id="${id}">樣本 ${id}</button>`).join('')}</div><div class="zoom-controls"><label for="zoomRange">倍率</label><input id="zoomRange" type="range" min="80" max="140" value="${state.zoom}" aria-label="筆跡放大倍率"><span id="zoomValue">${state.zoom}%</span><button class="btn sm ${state.overlay?'gold':''}" data-action="overlay">${state.overlay?'關閉疊合':'開啟疊合'}</button></div><p class="muted" style="font-size:.8rem;margin:9px 0 0">請切換至少兩份樣本，並嘗試疊合觀察字距與筆畫。C 的整體字風格較接近。</p></div></div></div>${state.sampleViews.length>=2&&f.hdCompared?`<div class="panel"><div class="section-label">筆跡推論 · 科學界線</div><p>樣本 C 的字跡與匿名便條看起來相似。這足以證明便條是 C 寫的嗎？</p><div class="choice-list"><button class="answer" data-action="hdAnswer" data-id="yes">足以證明。字型、筆壓和傾斜相似就是作者相同。</button><button class="answer ${f.hdJudgmentCorrect?'done':''}" data-action="hdAnswer" data-id="no">不能。需要更多有效樣本與適當的文件鑑定方法。</button></div>${f.hdJudgmentCorrect?knowledge('筆跡心理學與法庭文件鑑定','用字體大小、傾斜或筆壓推測人格，科學支持不足。文件鑑定可比較書寫特徵，但必須注意樣本品質、自然變異及方法限制。'):''}</div>`:`<div class="panel inset"><p>目前還缺少比較操作：已切換 ${state.sampleViews.length} / 2 份樣本，疊合 ${f.hdCompared?'已完成':'尚未操作'}。</p></div>`}${f.hdJudgmentCorrect?`<div class="panel"><div class="section-label">便條背面 · 新的物證</div><p>${state.noteBack?'標籤上寫著作業編號 P1530-4F21。請記下末四碼，後續可查列印紀錄。':'這張便條可能不只有正面文字。翻到背面確認是否有痕跡。'}</p>${f.noteFlipped?'<span class="tag ok">✓ 已將標籤登錄證據庫</span>':''}${finishButton(3,'進入第四章 →')}</div>`:''}`}
function camSVG(){return `<div class="cctv"><div class="cctv-head"><span>REC <span class="rec-light">●</span> CAM-03 / 走廊</span><span id="camClock">2026/11/13 15:34:00</span></div><svg id="camSvg" viewBox="0 0 640 300" role="img" aria-label="監視器模擬動畫：黃外套 C 從準備室帶藍袋走出，與灰外套 D 交接，D 再把袋子帶走"><defs><pattern id="tile" width="43" height="32" patternUnits="userSpaceOnUse"><path d="M 43 0 L 0 0 0 32" fill="none" stroke="#364c59" stroke-width="1"/></pattern><radialGradient id="vignette"><stop offset="0%" stop-color="#a7c2c1" stop-opacity=".08"/><stop offset="100%" stop-color="#02060b" stop-opacity=".64"/></radialGradient></defs><rect width="640" height="300" fill="#243843"/><path d="M0 192H640V300H0Z" fill="#34424a"/><rect y="194" width="640" height="106" fill="url(#tile)"/><rect x="24" y="45" width="96" height="150" rx="2" fill="#4a5d68" stroke="#79909b" stroke-width="4"/><rect x="43" y="70" width="55" height="85" fill="#233544"/><rect x="32" y="27" width="113" height="20" fill="#152630"/><text x="36" y="42" font-size="13" fill="#dae6df">準備室</text><rect x="502" y="55" width="113" height="142" fill="#485c68" stroke="#718693" stroke-width="3"/><text x="514" y="40" font-size="13" fill="#bacbd1">走廊西側</text><path d="M0 195H640" stroke="#82939b" stroke-width="3"/><g id="charC" transform="translate(80,0)"><ellipse cx="0" cy="250" rx="30" ry="7" fill="#06101999"/><circle cx="0" cy="108" r="18" fill="#d4b6a0"/><path d="M-22 128Q0 117 22 128L25 196H-24Z" fill="#ceae51" stroke="#efda8b" stroke-width="2"/><path d="M-19 193L-18 240M17 193L16 240" stroke="#1b2d38" stroke-width="13" stroke-linecap="round"/><path d="M-18 135L-35 173M17 135L29 178" stroke="#d4b6a0" stroke-width="9" stroke-linecap="round"/></g><g id="charD" transform="translate(510,0)"><ellipse cx="0" cy="250" rx="30" ry="7" fill="#06101999"/><circle cx="0" cy="108" r="18" fill="#c8b39e"/><path d="M-22 128Q0 117 22 128L25 196H-24Z" fill="#818a93" stroke="#b4bbc0" stroke-width="2"/><path d="M-19 193L-18 240M17 193L16 240" stroke=  {question:'拿著保管袋離開準備室的人穿什麼顏色的外套？',options:[['yellow','黃色'],['gray','灰色'],['black','黑色']],correct:'yellow'},

];
function chapter4(){const f=state.flags;return `${chapterHead('不可靠的證人','第四章｜眼睛記下的是影像，大腦重建的是故事')}<div class="panel"><div class="section-label">CAM-03 · 15：34 走廊監視影像</div><p>觀看完整 12 秒錄影。記住人物、衣服與物件交接；看完後會出現記憶測驗。</p>${camSVG()}<div class="cctv-bar"><button class="btn sm gold" data-action="playCam" id="playCam">${f.camSeen?'重新播放 12 秒':'播放影像 ▶'}</button><div class="track"><span id="camProgress" style="width:${f.camSeen?100:0}%"></span></div><span class="muted" id="camSeconds">${f.camSeen?'12 / 12 秒':'0 / 12 秒'}</span></div><p class="muted" style="font-size:.79rem;margin:9px 0 0">模擬監視器影像，劇情時間 15：34；片長 12 秒。可重看，沒有播放次數限制。</p></div>${f.camSeen?`<div class="panel"><div class="section-label">不依賴重播的第一印象測驗</div>${CAM_QUESTIONS.map((q,i)=>`<div class="quiz-question"><b>問題 ${i+1}｜${q.question}</b><div class="choice-list">${q.options.map(([id,txt])=>`<button class="answer ${state.choices.camAnswers[i]===id?'selected':''}" data-action="camAnswer" data-idx="${i}" data-id="${id}">${txt}</button>`).join('')}</div></div>`).join('')}<div class="toolbar"><button class="btn gold" data-action="verifyCam" ${Object.keys(state.choices.camAnswers).length!==3?'disabled':''}>檢查觀察紀錄</button>${f.camQuizDone?'<span class="tag ok">✓ 已通過觀察測驗</span>':''}</div>${consume()}${f.camQuizDone?knowledge('錯誤記憶與重建','記憶會受到注意力、時間與後續資訊影響。監視器可確認「誰移動了物品」，不會直接顯示意圖。目擊描述應與可核對紀錄比對。'):''}</div>`:''}${f.camQuizDone?`<div class="panel"><div class="section-label">訪談 C · 選擇提問方法</div><p>張曉彤正等待你的第一個問題。哪種問法最不容易把調查者的猜測塞進回答？</p><div class="choice-list"><button class="answer" data-action="cInterview" data-id="A">A. 是不是 D 叫你偷錢？</button><button class="answer" data-action="cInterview" data-id="B">B. 你是不是知道 D 想把錢藏起來？</button><button class="answer ${f.cInterviewCorrect?'done':''}" data-action="cInterview" data-id="C">C. 請描述你當時收到的通知，以及後來發生的事情。</button></div>${f.cInterviewCorrect?`<div class="quote"><b>張曉彤：</b>「我收到一張移交通知，上面寫要把 J-07 交給財務幹部。我以為那是老師安排，所以照做了。」</div><button class="btn" data-action="getNotice">${f.cNoticeSeen?'重新檢視通知及老師回覆':'取得移交通知，向老師查證 →'}</button>`:''}${f.cNoticeSeen?'<div class="notice ok">老師確認沒有發出通知。需要追查是誰製作，以及保管袋後來去了哪裡。</div>':''}${finishButton(4,'進入第五章 →')}</div>`:''}`}
function formatEvent(ev){return `<b>${ev.time}</b><span>${ev.text}</span>`}
function timelineView(){return `<div class="panel"><div class="section-label">事件排序 · 10 / 10 張事件卡</div><p>依時間先後排序：點一張卡，再點另一張即可交換；也可使用上下鍵或拖曳。資料會在重新整理後保留。</p><div class="timeline">${state.timelineOrder.map((id,i)=>{const e=EVENTS.find(x=>x.id===id);return `<div class="timeline-row ${timelinePicked===i?'picked':''}" draggable="true" data-drag-type="timeline" data-drag-id="${i}" data-drop-type="timeline" data-drop-id="${i}" data-action="timelinePick" data-idx="${i}" role="button" tabindex="0"><span class="position">${String(i+1).padStart(2,'0')}</span><div class="event-content">${formatEvent(e)}</div><div class="move-btns"><button class="btn sm sq" data-action="timelineMove" data-idx="${i}" data-dir="-1" aria-label="第${i+1}張向上移動" ${i===0?'disabled':''}>↑</button><button class="btn sm sq" data-action="timelineMove" data-idx="${i}" data-dir="1" aria-label="第${i+1}張向下移動" ${i===9?'disabled':''}>↓</button></div></div>`}).join('')}</div><div class="toolbar"><button class="btn gold" data-action="verifyTimeline">確認時間線</button><button class="btn sm" data-action="resetTimeline">重新打亂</button></div>${consume()}</div>`}
function chapter5(){const f=state.flags;if(f.branch)return branchView();if(f.inAccusation)return accusationView();return `${chapterHead('真相重組','第五章｜讓每一項說法回到可驗證的時間與位置')}<div class="panel"><div class="status-stripe"><span class="tag ${f.timelineSolved?'ok':'gold'}">① 時間線 ${f.timelineSolved?'已完成':'調查中'}</span><span class="tag ${f.printSolved?'ok':'gold'}">② 列印追查 ${f.printSolved?'已完成':'待查'}</span><span class="tag ${f.chainSolved?'ok':'gold'}">③ 證據鏈 ${f.chainSolved?'完整':'待整理'}</span></div></div>${!f.timelineSolved?timelineView():`<div class="panel"><div class="section-label">✓ 時間線已重建</div><p>關鍵節點依序為：保管袋仍在現場 → 移交通知列印 → 交接 → D 的去向聲明 → 器材室門禁。</p><div class="toolbar"><button class="btn sm" data-action="timelineReview">檢視已完成時間線</button></div></div><div class="panel"><div class="section-label">追加調查 · 查核去向</div><div class="grid2"><button class="tile ${f.cam41Viewed?'done':''}" data-action="cam41"><strong>15：41 器材室攝影機</strong><p>調取相鄰時點的影像與門禁資訊。</p><span class="tag">${f.cam41Viewed?'✓ 已收錄':'點擊調閱'}</span></button><button class="tile ${f.officeViewed?'done':''}" data-action="office"><strong>行政辦公室簽收簿</strong><p>查核是否有接收 J-07 的紀錄。</p><span class="tag">${f.officeViewed?'✓ 已收錄':'點擊查核'}</span></button></div></div><div class="panel"><div class="section-label">文件管理系統 · 列印紀錄查詢</div><p>從匿名便條背面取得列印作業識別碼末四碼。請輸入後調閱。</p><form data-form="printer"><label for="printCode" class="sr-only">列印作業識別碼末四碼</label><input class="form-input" id="printCode" autocomplete="off" maxlength="8" placeholder="輸入四碼" ${f.printSolved?'disabled':''} required><div class="toolbar"><button class="btn gold" type="submit" ${f.printSolved?'disabled':''}>查詢列印紀錄</button>${f.printSolved?'<span class="tag ok">✓ 帳號 4F21 ／ 登記人李予安</span>':''}</div></form>${f.printSolved?'<div class="quote">P1530-4F21｜15：30｜義賣款移交通知｜帳號 4F21｜登記人李予安。<br><small>注意：帳號歸屬不保證只有該人使用。</small></div>':''}${consume()}</div>${f.printSolved?evidenceWall():''}`}`}
function evidenceWall(){const f=state.flags;return `<div class="panel" id="evidence-wall"><div class="section-label">數位證據牆 · 請選三項關鍵證據</div><p>你需要建立「通知來源 → 保管袋交接 → 後續去向」的證據鏈。輔助證據可以支持推論，但不一定是最能連起三個環節的卡片。</p><div class="grid2">${EVIDENCE_CANDIDATES.map(id=>{const ev=EVIDENCE[id],available=state.evidence.includes(id),selected=state.selectedEvidence.includes(id);return `<button class="evidence-tile ${selected?'selected':''}" data-action="toggleEvidence" data-id="${id}" ${available?'':'disabled'}><strong>${ev.title}</strong><div style="color:#b5c1cd">${available?ev.support:'尚未取得：請先開啟相關調查資料'}</div><span class="tag ${id==='ace'||id==='handwriting'?'':'ok'}">${ev.type}</span>${selected?'<span class="check">✓ 已選</span>':''}</button>`}).join('')}</div><div class="toolbar"><span class="tag gold">${state.selectedEvidence.length} / 3 已選</span><button class="btn gold" data-action="verifyChain" ${state.selectedEvidence.length!==3?'disabled':''}>驗證三項證據鏈</button><button class="btn sm" data-action="accuse" ${f.chainSolved?'':'title="可先提出暫定指認，系統會回饋證據不足"'}>${f.chainSolved?'進行正式指認 →':'先提出暫定指認 →'}</button></div>${f.chainSolved?'<div class="notice ok">三個關鍵環節已經彼此連結。可以提出正式指認，並進行授權查證。</div>':''}${consume()}</div>`}
function accusationView(){const f=state.flags;return `${chapterHead(f.chainSolved?'最終指認':'暫定指認','你的判斷將接受客觀證據鏈的檢查')}<div class="panel gold-edge"><div class="section-label">調查員的選擇 · 請負責任地指認</div><p>目前哪名人物有最充分的證據支持其涉及 J-07 失蹤事件？${!f.chainSolved?'目前尚未完成三證連結，這次只能作為暫定判斷。':''}</p><div class="grid2">${Object.entries(PEOPLE).map(([id,p])=>`<button class="person" data-action="finalAccuse" data-id="${id}"><span class="avatar">${id}</span><strong>${p.name}</strong><span class="muted">${p.role}</span><small>提出指認</small></button>`).join('')}</div><div class="toolbar"><button class="btn ghost" data-action="backWall">← 返回證據牆</button></div></div>`}
function branchView(){const b=state.flags.branch;const p=PEOPLE[b.person],why={A:'A 的早期背景與 15：11 進出，不足以證明取走款項；15：28 的照片仍顯示 J-07 在桌上。',B:'B 的操控性發言值得辨識，但 15：28 的照片顯示他離開後袋子仍在；缺乏他取得 J-07 的客觀鏈結。',C:'15：34 影像確實拍到 C 移動保管袋，但也拍到她交給 D。是否知情，需查通知來源與後續藏放。'};return `${chapterHead(b.kind==='wrong'?'分歧結局：錯誤指認':'分歧結局：證據不足','這不是遊戲結束。調查容許修正，但要說明缺口。')}<div class="panel ${b.kind==='wrong'?'':'gold-edge'}"><div class="eyebrow">${b.kind==='wrong'?'RECHECK YOUR ASSUMPTION':'INCOMPLETE EVIDENCE CHAIN'}</div><h2>${b.kind==='wrong'?`指認 ${p.name}，證據不足`:'方向可能正確，證據鏈還不夠完整'}</h2><p>${b.kind==='wrong'?why[b.person]:'指向 D 的線索存在，但你尚未完整組合「15：30 列印」、「15：34 交接」、「15：41 器材室去向」三個獨立環節。先完成資料查核，避免只憑單一線索作出指認。'}</p><div class="quote">${b.kind==='wrong'?'人物背景、發言方式或先前接觸，只能產生調查假設，不能補上缺失的客觀證據。':'重新檢查每份紀錄能支持的事項，以及它各自的限制。'}</div><button class="btn gold" data-action="returnFromBranch">返回證據牆 · 修正推論 →</button></div>`}
function truthView(){let idx=state.truthIndex;return `${chapterHead('真相揭曉','真相回放｜調查推論接受實物與供述的核對')}<div class="panel gold-edge"><div class="section-label">CASE REPLAY · ${idx+1} / ${TRUTH.length}</div><div class="truth-lines">${TRUTH.slice(0,idx+1).map((d,i)=>`<div class="dialogue"><div class="speaker-icon">${d.symbol}</div><div class="speech"><strong>${d.who}</strong><p ${i===idx?'data-typewriter="current"':''}>${d.text}</p></div></div>`).join('')}</div>${idx>=5?'<div class="notice ok">J-07 已尋回，36,000 元確認完整。</div>':''}<div class="footer-actions"><span class="footnote">請逐段閱讀回放。所有資訊均可在證據庫再次檢視。</span><button class="btn gold" data-action="truthNext">${idx===TRUTH.length-1?'生成個人調查報告 →':'下一段回放 →'}</button></div></div>`}

function reportData(){const st=state.stats;const hintCount=Object.values(state.hints).reduce((a,b)=>a+b,0);const deductions=Math.min(48,st.wrongRisk*2+st.wrongTraits*2+st.wrongTimeline*2+st.wrongCode*2+st.wrongChain*3+st.memoryErrors*2+st.wrongAccusations*5+st.earlyAccusations*3+(st.childhoodBias?5:0)+(st.bInfluenced?5:0)+(st.handwritingBias?5:0)+(st.leadingQuestion?5:0)+hintCount*2);const score=Math.max(52,100-deductions);const grade=score>=90?'審慎的證據推理者':score>=75?'能修正假設的調查者':'正在鍛鍊證據意識的調查者';let biases=[];if(state.choices.initial==='A'||st.childhoodBias)biases.push(['背景歸因／刻板印象','你曾將 A 的成長背景放進涉案判斷；背景風險不能取代案發證據。']);if(state.choices.initial==='B'||st.bInfluenced)biases.push(['權威或言語框架影響','你曾受 B 的表述方向影響，或把言語操控視為高度涉案線索。']);if(state.choices.initial==='C'||st.handwritingBias)biases.push(['確認偏誤／筆跡相似性','你曾對 C 的移動行為或相似字跡給較多重量；需要核對來源與去向。']);if(state.choices.initial==='D'&&!st.earlyAccusations)biases.push(['提前聚焦的風險','你起初注意到 D；即使最後方向正確，也要防止只找支持原先想法的線索。']);if(st.leadingQuestion)biases.push(['暗示性提問','你曾選擇預設犯意的問法，可能污染證人陳述。']);if(st.memoryErrors)biases.push(['重建式記憶','你有 '+st.memoryErrors+' 次監視器觀察答題差錯，呈現注意與記憶可能遺漏資訊。']);if(st.wrongAccusations||st.earlyAccusations)biases.push(['過早下結論','你曾在證據不足或方向錯誤時指認，後來選擇重新調查。']);if(!biases.length)biases.push(['保持警覺','這次未記錄到指定的偏誤反應；不代表現實生活不會受到其他認知偏誤影響。']);const corrections=[];if(state.choices.initial&&state.choices.initial!=='D')corrections.push(`從最初「${labelPerson(state.choices.initial)}」修正為有完整證據支持的 D。`);if(st.childhoodBias)corrections.push('曾以童年背景懷疑 A，後來接受背景不能代替物證。');if(st.bInfluenced)corrections.push('曾被 B 引導懷疑 A，後來回到要求實際證據的提問。');if(st.handwritingBias)corrections.push('曾把筆跡相似視為作者認定，後來承認需正式鑑定。');if(st.leadingQuestion)corrections.push('曾使用暗示性問法，後來改採開放式訪談。');if(st.wrongAccusations||st.earlyAccusations)corrections.push('曾提交證據不足的指認，返回證據牆補齊關鍵鏈。');if(!corrections.length)corrections.push('全程保留假設，使用互相支持的證據後才做最終指認。');return {score,grade,hintCount,biases,corrections}}
function reportView(){const r=reportData();return `${chapterHead('CASE 017 — 個人調查報告','終章｜你也是本次調查的一部分')}<div id="printable"><div class="panel gold-edge"><div class="report-head"><div><div class="eyebrow">FINAL INVESTIGATION RECORD</div><h2>消失的三萬六千元</h2><div class="status-stripe"><span class="tag ok">已結案</span><span class="tag">J-07 · 36,000 元完整尋回</span></div></div><div style="text-align:right"><div class="score">${r.score}</div><small>推理紀錄分數 / 100</small></div></div><p style="margin:18px 0 0;color:#eacb96;font-weight:800">${r.grade}</p><p class="muted" style="font-size:.85rem">評價根據本次操作計算，用於學習回顧；不反映智力、人格或心理狀態。</p><div class="report-grid" style="margin-top:16px"><div class="metric"><small>調查完成時間</small><strong style="font-size:.97rem">${displayDate(state.completedAt)}</strong></div><div class="metric"><small>調查耗時</small><strong>${duration(state.elapsed)}</strong></div><div class="metric"><small>最初懷疑對象</small><strong>${labelPerson(state.choices.initial)}</strong></div><div class="metric"><small>最終指認對象</small><strong> D．李予安</strong></div><div class="metric"><small>取得證據</small><strong>${state.evidence.length} 件</strong></div><div class="metric"><small>使用提示</small><strong>${r.hintCount} 次</strong></div><div class="metric"><small>錯誤／過早指認</small><strong>${state.stats.wrongAccusations+state.stats.earlyAccusations} 次</strong></div></div></div><div class="panel"><div class="section-label">本次可能出現的推理偏誤</div>${r.biases.map(([name,msg])=>`<div class="reflection"><b>${name}</b><p style="margin:4px 0 0">${msg}</p></div>`).join('')}<p class="muted" style="font-size:.78rem">這些是遊戲內選項回顧，並非人格診斷；單次遊玩也不足以驗證真實的思考傾向。</p></div><div class="panel"><div class="section-label">你如何修正判斷</div>${r.corrections.map(c=>`<p class="reflection">${c}</p>`).join('')}<div class="section-label">五項心理學觀念</div><p><b>童年逆境經驗：</b>風險因子與保護因子影響處境，不能單憑背景推定犯行。</p><p><b>暗黑三角：</b>人格特質不是刑事責任或犯意鑑定工具。</p><p><b>筆跡心理學：</b>筆跡人格分析欠缺可靠支持；文件鑑定有專業程序與限制。</p><p><b>錯誤記憶：</b>目擊記憶具重建性，暗示性提問可能改變陳述。</p><p><b>確認偏誤：</b>持續主動檢查與最初猜測矛盾的證據。</p></div><div class="panel gold-edge"><p class="report-conclusion">「你以為自己一直在分析嫌疑人，但你有沒有發現，自己的判斷也正在受到影響？」</p><p>童年經歷、人格特質、筆跡、情緒表現與社會形象，都不能直接當成犯罪證據。此案最終以文件來源、交接紀錄、後續去向、實物尋回與供述核對來釐清事實。</p></div></div><div class="toolbar no-print"><button class="btn gold" data-action="print">保存結案報告（列印／PDF）</button><button class="btn" data-action="restartPrompt">重新遊玩</button><button class="btn ghost" data-action="evidence">檢視完整證據庫</button></div>`}
function render(top=false){if(typeTimer){clearInterval(typeTimer);typeTimer=null}let html=state.started&&!showingHome?(state.chapter===0?prologue():state.chapter===1?chapter1():state.chapter===2?chapter2():state.chapter===3?chapter3():state.chapter===4?chapter4():state.chapter===5?chapter5():state.chapter===6?truthView():reportView()):home();let y=window.scrollY;$('#app').innerHTML=state.started&&!showingHome?shell(html):html;save();if(top)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo(0,y);if(state.chapter===6&&!showingHome)revealLastDialogue()}
function revealLastDialogue(){const el=$('[data-typewriter]');if(!el||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const original=el.textContent;let count=0;el.textContent='';typeTimer=setInterval(()=>{if(!document.contains(el)){clearInterval(typeTimer);typeTimer=null;return}count=Math.min(count+2,original.length);el.textContent=original.slice(0,count);if(count===original.length){clearInterval(typeTimer);typeTimer=null}},22)}

 resetTimeline:()=>{state.timelineOrder=shuffle(EVENTS.map(e=>e.id));timelinePicked=null;noteAndRender('時間線已重新打亂。')},
 verifyTimeline:()=>{if(!EVENTS.every((e,i)=>state.timelineOrder[i]===e.id)){state.stats.wrongTimeline++;return noteAndRender('時間先後仍有錯誤。請從最早的 15：05 開始逐格比較，確認 15：30、15：31、15：34 的相對順序。','error')}state.flags.timelineSolved=true;gain('dClaim');logEvent('puzzle','timeline');noteAndRender('時間線正確。新調查資料已開放：器材室影像、辦公室簽收及列印紀錄。','success',true)},
 timelineReview:()=>modal('已完成的十項時間線',`<div class="timeline">${EVENTS.map((e,i)=>`<div class="timeline-row"><span class="position">${i+1}</span><div class="event-content">${formatEvent(e)}</div></div>`).join('')}</div>`),
 cam41:()=>{state.flags.cam41Viewed=true;gain('cam1541');render();modal('器材室 CAMERA-04 ｜15：41',`<div class="grid2"><div class="cctv" style="padding:16px;min-height:172px;background:linear-gradient(145deg,#182733,#334554)"><div style="color:#9ebac9;font:700 11px monospace">15:41:02 · ENTER</div><div style="height:110px;position:relative;border-bottom:3px solid #5b6b79"><div style="position:absolute;right:30%;top:32px;width:28px;height:64px;background:#808994;border-radius:12px 12px 4px 4px"></div><div style="position:absolute;right:22%;top:70px;width:26px;height:27px;background:#2479b2;border:2px solid #72b9d5"></div></div><small>灰色外套 D 帶著藍袋進入</small></div><div class="cctv" style="padding:16px;min-height:172px;background:linear-gradient(145deg,#182733,#334554)"><div style="color:#9ebac9;font:700 11px monospace">15:41:29 · EXIT</div><div style="height:110px;position:relative;border-bottom:3px solid #5b6b79"><div style="position:absolute;left:30%;top:32px;width:28px;height:64px;background:#808994;border-radius:12px 12px 4px 4px"></div></div><small>D 離開時未再持有該袋</small></div></div><p>門禁同時記錄 D 於 15：41 進入器材室。畫面顯示袋子跟著他進去、離開時不再持有；實際藏放位置仍待授權清查。</p>`)},
 office:()=>{state.flags.officeViewed=true;gain('office');render();evidenceView('office')},
 toggleEvidence:el=>{const id=el.dataset.id;if(!state.evidence.includes(id))return;let list=state.selectedEvidence;if(list.includes(id))state.selectedEvidence=list.filter(x=>x!==id);else if(list.length<3)list.push(id);else return noteAndRender('一次只能選三項。請先取消其中一項再選擇。','error');state.flags.chainSolved=false;render()},
 verifyChain:()=>{if(!PRINT_SELECTED.every(id=>state.selectedEvidence.includes(id))){state.stats.wrongChain++;return noteAndRender('組合尚未完整連接三個節點：通知來源、實際交接、最終去向。請再核對卡片的「可支持推論」。','error')}state.flags.chainSolved=true;logEvent('puzzle','chain');noteAndRender('證據鏈成立。三份獨立紀錄支持進一步調查 D 的保管袋去向。','success')},
 accuse:()=>{state.flags.inAccusation=true;render(true)},backWall:()=>{state.flags.inAccusation=false;render(true)},
 finalAccuse:el=>{const id=el.dataset.id;state.choices.final=id;logEvent('accusation',id);if(id!=='D'){state.stats.wrongAccusations++;state.stats.earlyAccusations+=state.flags.chainSolved?0:1;state.flags.branch={kind:'wrong',person:id};state.flags.inAccusation=false;return render(true)}if(!state.flags.chainSolved){state.stats.earlyAccusations++;state.flags.branch={kind:'insufficient',person:'D'};state.flags.inAccusation=false;return render(true)}state.finished.push(5);state.chapter=6;state.flags.inAccusation=false;state.flags.branch=null;state.truthIndex=0;render(true)},
 returnFromBranch:()=>{state.flags.branch=null;state.flags.inAccusation=false;render(true)},
 truthNext:()=>{if(state.truthIndex===4){gain('recovery')}if(state.truthIndex===5){gain('confession')}if(state.truthIndex<TRUTH.length-1){state.truthIndex++;render(true)}else{state.finished.push(6);state.chapter=7;state.completedAt=new Date().toISOString();render(true)}},
 print:()=>window.print()
};
function verifyPrinter(code){if(flag('printSolved'))return;const clean=code.trim().toUpperCase();if(clean!=='4F21'){state.stats.wrongCode++;return noteAndRender('查無相符作業。檢查匿名便條背面標籤末四碼；數字 1 與字母 I 不相同。','error')}state.flags.printSolved=true;gain('print');logEvent('puzzle','printer');noteAndRender('查詢成功：15：30，文件為「義賣款移交通知」；帳號登記人為李予安。','success')}
function playCamera(){if(camAnimation)return;const svg=$('#camSvg');if(!svg||state.chapter!==4)return;const c=$('#charC'),d=$('#charD'),bag=$('#blueBag'),progress=$('#camProgress'),clock=$('#camClock'),counter=$('#camSeconds'),button=$('#playCam');button.disabled=true;button.textContent='播放中…';const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));const started=performance.now();const step=(now)=>{if(state.chapter!==4||!document.contains(svg)){camStop();return}const t=Math.min(12,(now-started)/1000);let cx=t<1?75:t<4?lerp(75,207,(t-1)/3):t<8?207:lerp(207,155,(t-8)/4);let dx=t<2?510:t<5?lerp(510,310,(t-2)/3):t<7.5?310:lerp(310,573,(t-7.5)/4.5);c.setAttribute('transform',`translate(${cx},0)`);d.setAttribute('transform',`translate(${dx},0)`);const bx=t<6.5?cx+26:t<7.5?lerp(cx+26,dx+40,t-6.5):dx+40;bag.setAttribute('transform',`translate(${bx},0)`);clock.textContent=`2026/11/13 15:34:${String(Math.floor(t)).padStart(2,'0')}`;progress.style.width=`${t/12*100}%`;counter.textContent=`${Math.floor(t)} / 12 秒`;if(t<12){camAnimation.raf=requestAnimationFrame(step)}else{camAnimation=null;state.flags.camSeen=true;gain('cam1534');noteAndRender('影片播放完成。請先憑觀察作答，再決定是否重播。','success')}};camAnimation={raf:requestAnimationFrame(step)}}
document.addEventListener('click',e=>{const node=e.target.closest('[data-action]');if(!node)return;if(node.tagName==='BUTTON')e.preventDefault();const action=actions[node.dataset.action];if(action)action(node,e)});
document.addEventListener('submit',e=>{if(e.target.matches('[data-form="printer"]')){e.preventDefault();verifyPrinter($('#printCode').value)}});
document.addEventListener('input',e=>{if(e.target.id==='zoomRange'){state.zoom=+e.target.value;let zoom=$('.compare-wrap');if(zoom)zoom.style.setProperty('--zoom',state.zoom/100);if($('#zoomValue'))$('#zoomValue').textContent=state.zoom+'%';save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'||e.key===' '){let elem=e.target;if(elem.matches('[role="button"][data-action]')){e.preventDefault();elem.click()}}});
let dragged=null;
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag-type]');if(!el)return;dragged={type:el.dataset.dragType,id:el.dataset.dragId};if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(dragged))}});
document.addEventListener('dragover',e=>{let el=e.target.closest('[data-drop-type]');if(el&&dragged&&el.dataset.dropType===dragged.type)e.preventDefault()});
document.addEventListener('drop',e=>{let el=e.target.closest('[data-drop-type]');if(!el||!dragged||el.dataset.dropType!==dragged.type)return;e.preventDefault();const {type,id}=dragged;const target=el.dataset.dropId;if(type==='risk'){state.assignments[id]=target;state.flags.aSortSolved=false;selectedCard=null}else if(type==='trait'){state.traitMatches[id]=target;state.flags.traitsDone=false;selectedQuote=null}else if(type==='timeline'){const src=+id,dst=+target;let a=state.timelineOrder;const moved=a.splice(src,1)[0];a.splice(dst,0,moved);timelinePicked=null}dragged=null;render()});
document.addEventListener('dragend',()=>{dragged=null});
window.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(loop);loop=null;save();if(camAnimation)camStop()}else if(!loop){loop=setInterval(tick,1000)}});
window.addEventListener('pagehide',save);
state=load();render();loop=setInterval(tick,1000);
</script>
</body>
</html>
