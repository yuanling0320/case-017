function shuffle(input){let a=[...input];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===input[i]))[a[0],a[1]]=[a[1],a[0]];return a}
function load(){try{let raw=localStorage.getItem(SAVE_KEY);if(!raw)return freshState();let s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.evidence)||!s.flags||!s.stats||!s.choices)return freshState();const historicalMax=Math.max(s.chapter||0,...(Array.isArray(s.finished)?s.finished.map(n=>Number(n)+1):[0]));s.maxChapter=Math.max(0,Math.min(7,Number.isInteger(s.maxChapter)?s.maxChapter:historicalMax));s.chapter=Math.max(0,Math.min(s.chapter,s.maxChapter));return s}catch(e){return freshState()}}

function duration(sec){let s=Math.max(0,Math.floor(sec));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function logEvent(kind,value){state.history.push({kind,value,at:state.elapsed});if(state.history.length>100)state.history.shift()}
function gain(id){if(!EVIDENCE[id])return; if(!state.evidence.includes(id)){state.evidence.push(id);logEvent('evidence',id)}}
function flag(k){return !!state.flags[k]}
function note(message,kind='info'){flash={message,kind}}
function noticeHTML(){if(!flash)return '';return `<div class="notice ${flash.kind==='success'?'ok':flash.kind==='error'?'bad':''}" role="status">${flash.message}</div>`}
function consume(){let result=noticeHTML();flash=null;return result}
function displayType(type){return `<span class="tag ${type==='客觀紀錄'?'ok':''}">${type}</span>`}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function finishButton(ch,text='進入下一章 →'){return `<div class="footer-actions"><span class="footnote">核心調查操作完成後才能推進。</span><button class="btn gold" data-action="next" ${canNext(ch)?'':'disabled'}>${text}</button></div>`}
function canNext(ch){const f=state.flags;if(ch===0)return !!state.choices.initial&&state.viewedPeople.length===4;if(ch===1)return !!(f.aSortSolved&&f.aJudgmentCorrect&&f.aInterviewSeen&&f.aPhotoSeen);if(ch===2)return !!(f.traitsDone&&f.bResponseCorrect&&f.bRecordSeen);if(ch===3)return !!(f.hdJudgmentCorrect&&f.noteFlipped);if(ch===4)return !!(f.camQuizDone&&f.cInterviewCorrect&&f.cNoticeSeen);return false}

function chapter1(){const f=state.flags;return `${chapterHead('破碎的童年','第一章｜別把一段人生當成一份罪證')}<div class="panel"><div class="section-label">人物資料室 · 點擊四件物品</div><div class="room">${ROOM_OBJECTS.map(o=>`<button class="object-btn ${flag('room_'+o.id)?'seen':''}" data-action="roomObject" data-id="${o.id}"><div class="object-art">${roomObjectArt(o.id)}</div><div class="object-meta"><b>${o.name}</b><small>${flag('room_'+o.id)?'✓ 已讀檔':'點擊檢視背景資料與插圖'}</small></div></button>`).join('')}</div><p class="muted" style="font-size:.82rem;margin:11px 0 0">已檢視 ${ROOM_OBJECTS.filter(o=>flag('room_'+o.id)).length}/4 件。紙本背景資料只幫助理解個人處境，不能直接當成本案證據。</p></div>${ROOM_OBJECTS.every(o=>flag('room_'+o.id))?`<div class="panel"><div class="section-label">經歷卡片分類 · ${Object.keys(state.assignments).length}/4 已放置</div><p>先點選左側經歷卡，再點右側分類區；桌面也可拖曳放置。放錯可重新分類。</p><div class="split"><div><div class="grid2">${RISK_CARDS.map(c=>`<div class="sort-card ${selectedCard===c.id?'active':''}" draggable="true" data-drag-type="risk" data-drag-id="${c.id}" role="button" tabindex="0" data-action="selectRisk" data-id="${c.id}">${c.text}<span class="assigned">${state.assignments[c.id]?(state.assignments[c.id]==='risk'?'已放：風險':'已放：保護'):'點選或拖曳'}</span></div>`).join('')}</div></div><div class="grid2"><div class="dropzone risk" data-drop-type="risk" data-drop-id="risk" data-action="assignRisk" data-id="risk"><h3>可能的風險因子</h3><small>哪些經歷可能增加壓力？</small><div>${RISK_CARDS.filter(c=>state.assignments[c.id]==='risk').map(c=>`<span class="assigned-item">${c.text}</span>`).join('')}</div></div><div class="dropzone protect" data-drop-type="risk" data-drop-id="protect" data-action="assignRisk" data-id="protect"><h3>可能的保護因子</h3><small>哪些關係有助於因應？</small><div>${RISK_CARDS.filter(c=>state.assignments[c.id]==='protect').map(c=>`<span class="assigned-item">${c.text}</span>`).join('')}</div></div></div></div><div class="toolbar"><button class="btn gold" data-action="verifyRisk" ${Object.keys(state.assignments).length<4?'disabled':''}>檢查四張分類</button>${f.aSortSolved?'<span class="tag ok">✓ 分類正確</span>':''}</div>${consume()}</div>`:''}${f.aSortSolved?`<div class="panel"><div class="section-label">調查判斷 · 胖虎的過去是否就是證據？</div><p>你會如何評估胖虎的童年經歷與本案的關係？</p><div class="choice-list"><button class="answer" data-action="aJudgment" data-id="bias">因為他有家庭衝突與情緒困擾，所以他最可能涉案。</button><button class="answer ${f.aJudgmentCorrect?'done':''}" data-action="aJudgment" data-id="fair">這些背景可以幫助理解他的處境，但不能直接當成他偷拿保管袋的證據。</button></div>${f.aJudgmentCorrect?knowledge('童年逆境經驗（ACEs）','童年逆境可能與未來風險呈統計關聯，但它不決定個人的行為。保護因子如支持性的老師與穩定友誼，也可能大幅影響一個人的因應方式。'):''}</div>`:''}${f.aJudgmentCorrect?`<div class="panel"><div class="section-label">交叉查證時間證據</div><div class="toolbar"><button class="btn" data-action="aInterview">${f.aInterviewSeen?'重新檢視：15：11 訪談紀錄':'讀取胖虎的 15：11 訪談紀錄 →'}</button><button class="btn ${f.aPhotoSeen?'gold':''}" data-action="aPhoto"><strong>活動照片｜15：28</strong><p>照片背景可能包含重要現場資訊。</p><small>${f.aPhotoSeen?'✓ 已取得照片':'點擊檢視'}</small></button></div>${f.aInterviewSeen&&f.aPhotoSeen?'<div class="notice ok">胖虎在 15：11 進入，但 J-07 在 15：28 仍留在桌上。單靠早先進出無法支持他取走保管袋。</div>':''}${finishButton(1,'進入第二章 →')}</div>`:''}`}
function chapter2(){const f=state.flags;return `${chapterHead('操縱者的遊戲','第二章｜一段有說服力的話，離證據還有多遠？')}<div class="split"><div class="panel"><div class="section-label">虛構通訊紀錄 · 副社長小夫</div><div class="chat"><div class="chat-head"><span class="avatar" style="background:#365061;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:.78rem">小夫</span><div><b>小夫</b><div class="muted" style="font-size:.72rem">社團協作群組 · 訊息節錄</div></div></div><div class="bubble"><span class="who">小夫</span>如果沒有我，這個活動根本不可能成功。他們應該感謝我。</div><div class="bubble"><span class="who">小夫</span>只要讓他以為那是自己的決定，他就會照我的意思行動。</div><div class="bubble"><span class="who">小夫</span>他傷心跟我有什麼關係？只要我的目標達到了就好。</div></div>${knowledge('暗黑三角','暗黑三角涵蓋自戀、馬基維利主義與心理病態相關特質。這些概念描述特質傾向，不能用幾句話做診斷，更不能直接推定犯罪。')}</div><div class="panel"><div class="section-label">證詞分析 · 特質配對</div><p>挑一句對話，再點一個對應特質。右下方會即時顯示明確的配對結果；也能在電腦上拖曳。</p><div class="choice-list">${QUOTES.map(q=>`<button class="quote-tile ${selectedQuote===q.id?'selected':''}" data-action="quotePick" data-id="${q.id}" draggable="true" data-drag-type="trait" data-drag-id="${q.id}"><span class="tag">對話 ${q.id.slice(1)}</span><div style="margin-top:5px">${q.text}</div></button>`).join('')}</div><div class="grid3" style="margin-top:14px">${TRAITS.map(t=>`<div class="trait-target ${selectedQuote&&selectedQuote!==''?'active-target':''}" data-action="traitAssign" data-id="${t.id}" data-drop-type="trait" data-drop-id="${t.id}" role="button" tabindex="0"><strong>${t.name}</strong><span>${t.desc}</span></div>`).join('')}</div><div class="pair-dashboard">${QUOTES.map((q,idx)=>{const match=state.traitMatches[q.id]?TRAITS.find(t=>t.id===state.traitMatches[q.id]):null;return `<div class="pair-card ${selectedQuote===q.id?'current':''} ${match?'paired':''}"><div><span class="tag">對話 ${idx+1}</span><p>${q.text}</p></div><div class="pair-arrow">→</div><div>${match?`<span class="trait-badge">${match.name}</span><div class="muted" style="margin-top:7px;font-size:.8rem">${match.d function evidenceWall(){const f=state.flags;return `<div class="panel" id="evidence-wall"><div class="section-label">數位證據牆 · 請選三項關鍵證據</div><p>你需要建立「通知來源 → 保管袋交接 → 後續去向」的證據鏈。輔助證據可以支持推論，但不一定是最能連起三個環節的卡片。</p><div class="grid2">${EVIDENCE_CANDIDATES.map(id=>{const ev=EVIDENCE[id],available=state.evidence.includes(id),selected=state.selectedEvidence.includes(id);return `<button class="evidence-tile ${selected?'selected':''}" data-action="toggleEvidence" data-id="${id}" ${available?'':'disabled'}><strong>${ev.title}</strong><div style="color:#b5c1cd">${available?ev.support:'尚未取得：請先開啟相關調查資料'}</div><span class="tag ${id==='ace'||id==='handwriting'?'':'ok'}">${ev.type}</span>${selected?'<span class="check">✓ 已選</span>':''}</button>`}).join('')}</div><div class="toolbar"><span class="tag gold">${state.selectedEvidence.length} / 3 已選</span><button class="btn gold" data-action="verifyChain" ${state.selectedEvidence.length!==3?'disabled':''}>驗證三項證據鏈</button><button class="btn sm" data-action="accuse" ${f.chainSolved?'':'title="可先提出暫定指認，系統會回饋證據不足"'}>${f.chainSolved?'進行正式指認 →':'先提出暫定指認 →'}</button></div>${f.chainSolved?'<div class="notice ok">三個關鍵環節已經彼此連結。可以提出正式指認，並進行授權查證。</div>':''}${consume()}</div>`}
function accusationView(){const f=state.flags;return `${chapterHead(f.chainSolved?'最終指認':'暫定指認','你的判斷將接受客觀證據鏈的檢查')}<div class="panel gold-edge"><div class="section-label">調查員的選擇 · 請負責任地指認</div><p>目前哪名人物有最充分的證據支持其涉及 J-07 失蹤事件？${!f.chainSolved?'目前尚未完成三證連結，這次只能作為暫定判斷。':''}</p><div class="grid2">${Object.entries(PEOPLE).map(([id,p])=>`<button class="person" data-action="finalAccuse" data-id="${id}"><span class="avatar person-name-avatar">${p.name}</span><strong>${p.name}</strong><span class="muted">${p.role}</span><small>提出指認</small></button>`).join('')}</div><div class="toolbar"><button class="btn ghost" data-action="backWall">← 返回證據牆</button></div></div>`}
function branchView(){const b=state.flags.branch;const p=PEOPLE[b.person],why={A:'胖虎的早期背景與 15：11 進出，不足以證明取走款項；15：28 的照片仍顯示 J-07 在桌上。',B:'小夫的操控性發言值得辨識，但 15：28 的照片顯示他離開後袋子仍在；缺乏他取得 J-07 的客觀鏈結。',C:'15：34 影像確實拍到靜香移動保管袋，但也拍到她交給大雄。是否知情，需查通知來源與後續藏放。'};return `${chapterHead(b.kind==='wrong'?'分歧結局：錯誤指認':'分歧結局：證據不足','這不是遊戲結束。調查容許修正，但要說明缺口。')}<div class="panel ${b.kind==='wrong'?'':'gold-edge'}"><div class="eyebrow">${b.kind==='wrong'?'RECHECK YOUR ASSUMPTION':'INCOMPLETE EVIDENCE CHAIN'}</div><h2>${b.kind==='wrong'?`指認 ${p.name}，證據不足`:'方向可能正確，證據鏈還不夠完整'}</h2><p>${b.kind==='wrong'?why[b.person]:'指向大雄的線索存在，但你尚未完整組合「15：30 列印」、「15：34 交接」、「15：41 器材室去向」三個獨立環節。先完成資料查核，避免只憑單一線索作出指認。'}</p><div class="quote">${b.kind==='wrong'?'人物背景、發言方式或先前接觸，只能產生調查假設，不能補上缺失的客觀證據。':'重新檢查每份紀錄能支持的事項，以及它各自的限制。'}</div><button class="btn gold" data-action="returnFromBranch">返回證據牆 · 修正推論 →</button></div>`}
function truthView(){const started=state.truthIndex>=0;const visible=started?TRUTH:[];return `${chapterHead('真相揭曉','真相回放｜調查推論接受實物與供述的核對')}<div class="panel gold-edge"><div class="section-label">CASE REPLAY · ${started?'完整回放':'等待展開'}</div>${!started?`<div class="truth-start"><div class="quote">你不需要再一段一段點閱。按下方按鈕後，系統會一次展開完整回放，讓你連續閱讀整體案情。</div><p class="muted">這段回放會依序呈現：偽造通知、交接、器材室去向、搜查結果與供述。</p></div>`:`<div class="truth-lines">${visible.map((d,i)=>`<div class="dialogue" style="--i:${i}"><div class="speaker-icon">${d.symbol}</div><div class="speech"><strong>${d.who}</strong><p>${d.text}</p></div></div>`).join('')}</div>${visible.length>=6?'<div class="notice ok">J-07 已尋回，36,000 元確認完整。</div>':''}`}<div class="footer-actions ${started?'tight':''}"><span class="footnote">所有回放資訊均可在證據庫再次檢視。</span><button class="btn gold" data-action="truthNext">${started?'生成個人調查報告 →':'開始完整回放 →'}</button></div></div>`}
function displayDate(iso){if(!iso)return '—';return new Date(iso).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function labelPerson(id){return id==='E'?'證據不足':id&&PEOPLE[id]?`${PEOPLE[id].name}`:'未選擇'}
function reportData(){const st=state.stats;const hintCount=Object.values(state.hints).reduce((a,b)=>a+b,0);const deductions=Math.min(48,st.wrongRisk*2+st.wrongTraits*2+st.wrongTimeline*2+st.wrongCode*2+st.wrongChain*3+st.memoryErrors*2+st.wrongAccusations*5+st.earlyAccusations*3+(st.childhoodBias?5:0)+(st.bInfluenced?5:0)+(st.handwritingBias?5:0)+(st.leadingQuestion?5:0)+hintCount*2);const score=Math.max(52,100-deductions);const grade=score>=90?'審慎的證據推理者':score>=75?'能修正假設的調查者':'正在鍛鍊證據意識的調查者';let biases=[];if(state.choices.initial==='A'||st.childhoodBias)biases.push(['背景歸因／刻板印象','你曾將胖虎的成長背景放進涉案判斷；背景風險不能取代案發證據。']);if(state.choices.initial==='B'||st.bInfluenced)biases.push(['權威或言語框架影響','你曾受小夫的表述方向影響，或把言語操控視為高度涉案線索。']);if(state.choices.initial==='C'||st.handwritingBias)biases.push(['確認偏誤／筆跡相似性','你曾對靜香的移動行為或相似字跡給較多重量；需要核對來源與去向。']);if(state.choices.initial==='D'&&!st.earlyAccusations)biases.push(['提前聚焦的風險','你起初注意到大雄；即使最後方向正確，也要防止只找支持原先想法的線索。']);if(st.leadingQuestion)biases.push(['暗示性提問','你曾選擇預設犯意的問法，可能污染證人陳述。']);if(st.memoryErrors)biases.push(['重建式記憶','你有 '+st.memoryErrors+' 次監視器觀察答題差錯，呈現注意與記憶可能遺漏資訊。']);if(st.wrongAccusations||st.earlyAccusations)biases.push(['過早下結論','你曾在證據不足或方向錯誤時指認，後來選擇重新調查。']);if(!biases.length)biases.push(['保持警覺','這次未記錄到指定的偏誤反應；不代表現實生活不會受到其他認知偏誤影響。']);const corrections=[];if(state.choices.initial&&state.choices.initial!=='D')corrections.push(`從最初「${labelPerson(state.choices.initial)}」修正為有完整證據支持的大雄。`);if(st.childhoodBias)corrections.push('曾以童年背景懷疑胖虎，後來接受背景不能代替物證。');if(st.bInfluenced)corrections.push('曾被小夫引導懷疑胖虎，後來回到要求實際證據的提問。');if(st.handwritingBias)corrections.push('曾把筆跡相似視為作者認定，後來承認需正式鑑定。');if(st.leadingQuestion)corrections.push('曾使用暗示性問法，後來改採開放式訪談。');if(st.wrongAccusations||st.earlyAccusations)corrections.push('曾提交證據不足的指認，返回證據牆補齊關鍵鏈。');if(!corrections.length)corrections.push('全程保留假設，使用互相支持的證據後才做最終指認。');return {score,grade,hintCount,biases,corrections}}
function reportView(){const r=reportData();return `${chapterHead('CASE 018 — 個人調查報告','終章｜你也是本次調查的一部分')}<div id="printable"><div class="panel gold-edge"><div class="report-head"><div><div class="eyebrow">FINAL INVESTIGATION RECORD</div><h2>消失的三萬六千元</h2><div class="status-stripe"><span class="tag ok">已結案</span><span class="tag">J-07 · 36,000 元完整尋回</span></div></div><div style="text-align:right"><div class="score">${r.score}</div><small>推理紀錄分數 / 100</small></div></div><p style="margin:18px 0 0;color:#eacb96;font-weight:800">${r.grade}</p><p class="muted" style="font-size:.85rem">評價根據本次操作計算，用於學習回顧；不反映智力、人格或心理狀態。</p><div class="report-grid" style="margin-top:16px"><div class="metric"><small>調查完成時間</small><strong style="font-size:.97rem">${displayDate(state.completedAt)}</strong></div><div class="metric"><small>調查耗時</small><strong>${duration(state.elapsed)}</strong></div><div class="metric"><small>最初懷疑對象</small><strong>${labelPerson(state.choices.initial)}</strong></div><div class="metric"><small>最終指認對象</small><strong>${labelPerson('D')}</strong></div><div class="metric"><small>取得證據</small><strong>${state.evidence.length} 件</strong></div><div class="metric"><small>使用提示</small><strong>${r.hintCount} 次</strong></div><div class="metric"><small>錯誤／過早指認</small><strong>${state.stats.wrongAccusations+state.stats.earlyAccusations} 次</strong></div></div></div><div class="panel"><div class="section-label">本次可能出現的推理偏誤</div>${r.biases.map(([name,msg])=>`<div class="reflection"><b>${name}</b><p style="margin:4px 0 0">${msg}</p></div>`).join('')}<p class="muted" style="font-size:.78rem">這些是遊戲內選項回顧，並非人格診斷；單次遊玩也不足以驗證真實的思考傾向。</p></div><div class="panel"><div class="section-label">你如何修正判斷</div>${r.corrections.map(c=>`<p class="reflection">${c}</p>`).join('')}<div class="section-label">五項心理學觀念</div><p><b>童年逆境經驗：</b>風險因子與保護因子影響處境，不能單憑背景推定犯行。</p><p><b>暗黑三角：</b>人格特質不是刑事責任或犯意鑑定工具。</p><p><b>筆跡心理學：</b>筆跡人格分析欠缺可靠支持；文件鑑定有專業程序與限制。</p><p><b>錯誤記憶：</b>目擊記憶具重建性，暗示性提問可能改變陳述。</p><p><b>確認偏誤：</b>持續主動檢查與最初猜測矛盾的證據。</p></div><div class="panel gold-edge"><p class="report-conclusion">「你以為自己一直在分析嫌疑人，但你有沒有發現，自己的判斷也正在受到影響？」</p><p>童年經歷、人格特質、筆跡、情緒表現與社會形象，都不能直接當成犯罪證據。此案最終以文件來源、交接紀錄、後續去向、實物尋回與供述核對來釐清事實。</p></div></div><div class="toolbar no-print"><button class="btn gold" data-action="print">保存結案報告（列印／PDF）</button><button class="btn" data-action="restartPrompt">重新遊玩</button><button class="btn ghost" data-action="evidence">檢視完整證據庫</button></div>`}
function render(top=false){if(typeTimer){clearInterval(typeTimer);typeTimer=null}let html=state.started&&!showingHome?(state.chapter===0?prologue():state.chapter===1?chapter1():state.chapter===2?chapter2():state.chapter===3?chapter3():state.chapter===4?chapter4():state.chapter===5?chapter5():state.chapter===6?truthView():reportView()):home();let y=window.scrollY;$('#app').innerHTML=state.started&&!showingHome?shell(html):html;save();if(top)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo(0,y);if(state.chapter===6&&!showingHome)revealLastDialogue()}
function revealLastDialogue(){const el=$('[data-typewriter]');if(!el||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const original=el.textContent;let count=0;el.textContent='';typeTimer=setInterval(()=>{if(!document.contains(el)){clearInterval(typeTimer);typeTimer=null;return}count=Math.min(count+2,original.length);el.textContent=original.slice(0,count);if(count===original.length){clearInterval(typeTimer);typeTimer=null}},22)}
function modal(title,body){$('#modal-root').innerHTML=`<div class="modal-layer" role="presentation" data-action="closeOutside"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${title}</h2><button class="close" data-action="closeModal" aria-label="關閉">×</button></div><div class="modal-body">${body}</div></div></div>`;$('.modal .close')?.focus()}

function showHint(){let ch=state.chapter,n=state.hints[ch]||0;if(n<2){state.hints[ch]=n+1;logEvent('hint',ch);save()}let current=state.hints[ch];modal(`第 ${current} 階段提示｜${CHAPTERS[ch]}`,`<div class="quote">${HINTS[ch][current-1]}</div><p class="muted">每章最多兩階段提示；重看不重複計次。已使用總次數：${Object.values(state.hints).reduce((a,b)=>a+b,0)} 次。</p>${current===1?'<button class="btn gold" data-action="hintNext">揭露第二階段提示</button>':''}`)}
function chapterPicker(){const list=CHAPTERS.map((name,i)=>`<button type="button" class="chapter-pick ${i===state.chapter?'current':''}" data-action="navChapter" data-id="${i}" ${i>state.maxChapter?'disabled':''}><span class="pick-ordinal">${i>state.maxChapter?'⌑':i<state.maxChapter?'✓':i+1}</span><span class="pick-name">${name}<small>${i>state.maxChapter?'尚未解鎖':i===state.chapter?'目前所在章節':'點擊回到這一章'}</small></span></button>`).join('');modal('CASE 018｜章節索引',`<p class="muted">已解鎖章節可隨時回看，不會清除證據或更改作答紀錄。尚未完成的關卡仍需依序解鎖。</p><div class="chapter-picker">${list}</div>`)}

 toggleEvidence:el=>{const id=el.dataset.id;if(!state.evidence.includes(id))return;let list=state.selectedEvidence;if(list.includes(id))state.selectedEvidence=list.filter(x=>x!==id);else if(list.length<3)list.push(id);else return noteAndRender('一次只能選三項。請先取消其中一項再選擇。','error');state.flags.chainSolved=false;render()},
 verifyChain:()=>{if(!PRINT_SELECTED.every(id=>state.selectedEvidence.includes(id))){state.stats.wrongChain++;return noteAndRender('組合尚未完整連接三個節點：通知來源、實際交接、最終去向。請再核對卡片的「可支持推論」。','error')}state.flags.chainSolved=true;logEvent('puzzle','chain');noteAndRender('證據鏈成立。三份獨立紀錄支持進一步調查大雄的保管袋去向。','success')},
 accuse:()=>{state.flags.inAccusation=true;render(true)},backWall:()=>{state.flags.inAccusation=false;render(true)},
 finalAccuse:el=>{const id=el.dataset.id;state.choices.final=id;logEvent('accusation',id);if(id!=='D'){state.stats.wrongAccusations++;state.stats.earlyAccusations+=state.flags.chainSolved?0:1;state.flags.branch={kind:'wrong',person:id};state.flags.inAccusation=false;return render(true)}if(!state.flags.chainSolved){state.stats.earlyAccusations++;state.flags.branch={kind:'insufficient',person:'D'};state.flags.inAccusation=false;return render(true)}state.finished.push(5);state.chapter=6;state.maxChapter=Math.max(state.maxChapter,6);state.flags.inAccusation=false;state.flags.branch=null;state.truthIndex=-1;render(true)},
 returnFromBranch:()=>{state.flags.branch=null;state.flags.inAccusation=false;render(true)},

function verifyPrinter(code){
 if(flag('printSolved'))return;
 const clean=String(code||'').trim().toUpperCase().replace(/\s/g,'');
 if(!clean)return noteAndRender('請輸入匿名便條背面的作業識別碼末四碼。','error');
 if(clean!=='4F21'&&clean!=='P1530-4F21'){
  state.stats.wrongCode++;
  return noteAndRender('查無相符作業。請核對匿名便條背面標籤的末四碼（4F21）；字母與數字不可混淆。','error');
 }
 state.flags.printSolved=true;
 gain('print');logEvent('puzzle','printer');
 noteAndRender('查詢成功！已取得 15：30 義賣款移交通知列印紀錄，並開啟證據牆。','success');
}
function playCamera(){if(camAnimation)return;const svg=$('#camSvg');if(!svg||state.chapter!==4)return;const c=$('#charC'),d=$('#charD'),bag=$('#blueBag'),progress=$('#camProgress'),clock=$('#camClock'),counter=$('#camSeconds'),button=$('#playCam');button.disabled=true;button.textContent='播放中…';const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));const started=performance.now();const step=(now)=>{if(state.chapter!==4||!document.contains(svg)){camStop();return}const t=Math.min(12,(now-started)/1000);let cx=t<1?75:t<4?lerp(75,207,(t-1)/3):t<8?207:lerp(207,155,(t-8)/4);let dx=t<2?510:t<5?lerp(510,310,(t-2)/3):t<7.5?310:lerp(310,573,(t-7.5)/4.5);c.setAttribute('transform',`translate(${cx},0)`);d.setAttribute('transform',`translate(${dx},0)`);const bx=t<6.5?cx+26:t<7.5?lerp(cx+26,dx+40,t-6.5):dx+40;bag.setAttribute('transform',`translate(${bx},0)`);clock.textContent=`2026/11/13 15:34:${String(Math.floor(t)).padStart(2,'0')}`;progress.style.width=`${t/12*100}%`;counter.textContent=`${Math.floor(t)} / 12 秒`;if(t<12){camAnimation.raf=requestAnimationFrame(step)}else{camAnimation=null;state.flags.camSeen=true;gain('cam1534');noteAndRender('影片播放完成。請先憑觀察作答，再決定是否重播。','success')}};camAnimation={raf:requestAnimationFrame(step)}}
document.addEventListener('click',e=>{const node=e.target.closest('[data-action]');if(!node)return;if(node.tagName==='BUTTON')e.preventDefault();const action=actions[node.dataset.action];if(action)action(node,e)});
document.addEventListener('submit',e=>{if(e.target.matches('[data-form="printer"]')){e.preventDefault();verifyPrinter($('#printCode')?.value||'')}});
document.addEventListener('input',e=>{if(e.target.id==='zoomRange'){state.zoom=+e.target.value;let zoom=$('.compare-wrap');if(zoom)zoom.style.setProperty('--zoom',state.zoom/100);if($('#zoomValue'))$('#zoomValue').textContent=state.zoom+'%';save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'||e.key===' '){let elem=e.target;if(elem.matches('[role="button"][data-action]')){e.preventDefault();elem.click()}}});
let dragged=null;
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag-type]');if(!el)return;dragged={type:el.dataset.dragType,id:el.dataset.dragId};if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(dragged))}});
document.addEventListener('dragover',e=>{let el=e.target.closest('[data-drop-type]');if(el&&dragged&&el.dataset.dropType===dragged.type)e.preventDefault()});
document.addEventListener('drop',e=>{let el=e.target.closest('[data-drop-type]');if(!el||!dragged||el.dataset.dropType!==dragged.type)return;e.preventDefault();const {type,id}=dragged;const target=el.dataset.dropId;if(type==='risk'){state.assignments[id]=target;state.flags.aSortSolved=false;selectedCard=null}else if(type==='trait'){state.traitMatches[id]=target;state.flags.traitsDone=false;selectedQuote=null}else if(type==='timeline'){const src=+id,dst=+target;let a=state.timelineOrder;const moved=a.splice(src,1)[0];a.splice(dst,0,moved);timelinePicked=null}dragged=null;render()});
document.addEventListener('dragend',()=>{dragged=null});
window.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(loop);loop=null;save();if(camAnimation)camStop()}else if(!loop){loop=setInterval(tick,1000)}});
window.addEventListener('pagehide',save);
state=load();render();loop=setInterval(tick,1000);
